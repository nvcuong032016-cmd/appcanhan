<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mr Cường</title><style>
:root{--bg:#0b0f17;--card:#172033;--border:#ffffff14;--primary:#38bdf8;--text:#f8fafc;--sub:#94a3b8;--danger:#f43f5e;--success:#10b981}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:100px}.header{position:sticky;top:0;z-index:5;padding:18px;text-align:center;background:#0b0f17e8;border-bottom:1px solid var(--border);backdrop-filter:blur(16px)}h1{margin:0;font-size:18px}.container{max-width:600px;margin:auto;padding:16px}.tab{display:none}.tab.active{display:block}.banner,.card,.calendar{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}.banner{background:linear-gradient(135deg,#1e293b,#0f172a)}.banner h2{margin:0 0 4px;color:var(--primary)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px}.stat.full{grid-column:span 2}.muted{color:var(--sub);font-size:12px}.value{font-size:18px;font-weight:800;margin-top:5px}.segment{display:flex;gap:4px;background:#0f172acc;padding:4px;border-radius:12px;margin-bottom:15px}.segment button{flex:1;padding:10px;border:0;border-radius:8px;background:transparent;color:var(--sub);font-weight:700}.segment button.active{background:linear-gradient(135deg,#38bdf8,#2563eb);color:white}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:13px}.task.done span{text-decoration:line-through;color:var(--sub)}.progress{height:7px;background:#ffffff12;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#2563eb)}.fab{position:fixed;right:20px;bottom:94px;width:56px;height:56px;border:0;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#2563eb);color:white;font-size:28px;z-index:10}.nav{position:fixed;left:16px;right:16px;bottom:16px;height:64px;background:#0f172aed;border:1px solid #ffffff1f;border-radius:32px;display:flex;z-index:9;backdrop-filter:blur(20px)}.nav button{flex:1;border:0;background:none;color:var(--sub);font-weight:600}.nav button.active{color:var(--primary)}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:600px;margin:auto;background:#131b2e;border-radius:24px 24px 0 0;padding:22px}.sheet input,.sheet select{width:100%;padding:12px;margin:6px 0 14px;background:#0f172a;color:white;border:1px solid var(--border);border-radius:10px}.actions{display:flex;gap:10px}.actions button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border)}.save{background:#38bdf8;border:0!important;font-weight:700}.credit{background:linear-gradient(135deg,#1e293b,#0f172a)}
</style></head><body><div class="header"><h1>MR CƯỜNG</h1></div><main class="container">
<section id="home" class="tab active"><div class="banner"><h2>👑 Bệ hạ vạn tuế!</h2><div class="muted">Tổng quan công việc & tài chính</div></div><div class="calendar row between"><div><div class="muted">DƯƠNG LỊCH</div><b id="date">--/--/----</b></div><div><div class="muted">ÂM LỊCH</div><b style="color:var(--primary)">--/--</b></div></div><div class="stats"><div class="stat"><div class="muted">📁 Dự án</div><div class="value" id="projectCount">0</div></div><div class="stat"><div class="muted">📌 Việc riêng</div><div class="value" id="singleCount">0</div></div><div class="stat full"><div class="muted">💳 Thẻ tín dụng</div><div class="value" id="cardCount">0</div></div><div class="stat full"><div class="muted">🏦 Khoản vay / trả góp</div><div class="value" id="loanCount">0</div></div></div></section>
<section id="work" class="tab"><div class="segment"><button id="projectsBtn" class="active" onclick="workMode('projects')">Dự án</button><button id="singlesBtn" onclick="workMode('singles')">Việc riêng</button></div><div id="projectList"></div><div id="singleList" style="display:none"></div></section>
<section id="personal" class="tab"><div class="segment"><button class="active" onclick="financeMode('cards',this)">Tín dụng</button><button onclick="financeMode('loans',this)">Vay / Trả góp</button></div><div id="cardList"></div><div id="loanList" style="display:none"></div></section></main><button id="fab" class="fab" onclick="add()">+</button><nav class="nav"><button class="active" onclick="tab('home',this)">⌂<br>Trang chủ</button><button onclick="tab('work',this)">☷<br>Công việc</button><button onclick="tab('personal',this)">♙<br>Cá nhân</button></nav>
<div id="modal" class="modal"><div class="sheet"><h3 id="modalTitle">Thêm</h3><div id="form"></div><div class="actions"><button onclick="closeModal()">Hủy</button><button class="save" onclick="saveForm()">Lưu</button></div></div></div>
<script>
const KEY='mr_cuong_v1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{projects:[],singles:[],cards:[],loans:[]};let mode='projects',finance='cards',formType='';
const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('vi-VN').format(Number(n)||0)+' VNĐ';
function persist(){localStorage.setItem(KEY,JSON.stringify(state));render()};function tab(id,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('fab').style.display=id==='home'?'none':'block'}
function workMode(m){mode=m;$('projectsBtn').classList.toggle('active',m==='projects');$('singlesBtn').classList.toggle('active',m==='singles');$('projectList').style.display=m==='projects'?'block':'none';$('singleList').style.display=m==='singles'?'block':'none'}
function financeMode(m,b){finance=m;document.querySelectorAll('#personal .segment button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('cardList').style.display=m==='cards'?'block':'none';$('loanList').style.display=m==='loans'?'block':'none'}
function add(){if(document.querySelector('.tab.active').id==='work'){if(mode==='projects'){formType='project';showForm('Tạo dự án','Tên dự án')}else{formType='single';showForm('Thêm việc riêng','Tên công việc')}}else{formType=finance==='cards'?'card':'loan';showForm(formType==='card'?'Thêm thẻ tín dụng':'Thêm khoản vay',formType==='card'?'Ngân hàng':'Tên khoản vay')}}
function showForm(title,label){$('modalTitle').textContent=title;$('form').innerHTML=`<label class="muted">${label}</label><input id="fName" autofocus placeholder="Nhập thông tin">${formType==='project'?'<label class="muted">Nhiệm vụ con (mỗi dòng một nhiệm vụ)</label><textarea id="fTasks" rows="6" style="width:100%;background:#0f172a;color:white;border:1px solid #ffffff14;border-radius:10px;padding:10px" placeholder="Lập kế hoạch\nTheo dõi tiến độ\n..."></textarea>':''}${formType==='card'?'<label class="muted">Ngày sao kê</label><input id="fStmt" type="number" min="1" max="31"><label class="muted">Ngày thanh toán</label><input id="fDue" type="number" min="1" max="31">':''}${formType==='loan'?'<label class="muted">Số tiền vay</label><input id="fAmount" type="number"><label class="muted">Trả hàng tháng</label><input id="fMonthly" type="number"><label class="muted">Số kỳ</label><input id="fTerm" type="number">':''}`;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')};function saveForm(){let n=$('fName').value.trim();if(!n)return;if(formType==='project')state.projects.push({name:n,tasks:($('fTasks').value||'').split('\n').map(x=>x.trim()).filter(Boolean).map(title=>({title,done:false}))});if(formType==='single')state.singles.push({name:n});if(formType==='card')state.cards.push({bank:n,stmt:$('fStmt').value,due:$('fDue').value});if(formType==='loan')state.loans.push({name:n,amount:$('fAmount').value,monthly:$('fMonthly').value,term:$('fTerm').value,paid:0});closeModal();persist()}
function toggleTask(p,i){p.tasks[i].done=!p.tasks[i].done;persist()};function render(){ $('projectCount').textContent=state.projects.length;$('singleCount').textContent=state.singles.length;$('cardCount').textContent=state.cards.length;$('loanCount').textContent=state.loans.length;$('projectList').innerHTML=state.projects.map((p,pi)=>{let done=p.tasks.filter(t=>t.done).length,pct=p.tasks.length?Math.round(done/p.tasks.length*100):0;return `<div class="card"><div class="row between"><b>📁 ${esc(p.name)}</b><span>${pct}%</span></div><div class="progress" style="margin:10px 0"><i style="width:${pct}%"></i></div>${p.tasks.map((t,i)=>`<label class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(state.projects[${pi}],${i})"><span>${esc(t.title)}</span></label>`).join('')}</div>`}).join('');$('singleList').innerHTML=state.singles.map(x=>`<div class="card">📌 ${esc(x.name)}</div>`).join('');$('cardList').innerHTML=state.cards.map(c=>`<div class="card credit"><b>${esc(c.bank)}</b><div class="muted" style="margin-top:8px">Sao kê: ngày ${c.stmt||'--'} • Thanh toán: ngày ${c.due||'--'}</div></div>`).join('');$('loanList').innerHTML=state.loans.map(l=>`<div class="card"><b>🏦 ${esc(l.name)}</b><div class="muted" style="margin-top:8px">${money(l.monthly)}/tháng • ${l.paid||0}/${l.term||0} kỳ</div></div>`).join('')};function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))};
let d=new Date();$('date').textContent=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();$('fab').style.display='none';render();
</script></body></html>
